<!doctype html>
<html lang="km">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>រាយការណ៍សម្ភារៈកុំព្យូទ័រ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>📋 រាយការណ៍ស្ថានភាពសម្ភារៈ</h1>
      <p>បំពេញព័ត៌មានខាងក្រោម រួចចុចបញ្ជូន</p>
    </header>

    <form id="form" novalidate>
      <p class="reporter" id="reporter" hidden>👤 អ្នករាយការណ៍៖ <b id="reporterName"></b></p>

      <section class="field" data-field="type">
        <span class="label">ប្រភេទសម្ភារៈ <b>*</b></span>
        <div id="type" class="grid two" role="radiogroup"></div>
        <small class="err">សូមជ្រើសរើសប្រភេទសម្ភារៈ</small>
      </section>

      <section class="field" data-field="other" id="otherField" hidden>
        <label for="other">សូមបញ្ជាក់ប្រភេទសម្ភារៈ <b>*</b></label>
        <input id="other" type="text" maxlength="100" placeholder="ឧ. Mouse, Headset, ...">
        <small class="err">សូមបញ្ជាក់ប្រភេទសម្ភារៈ</small>
      </section>

      <section class="field" data-field="status">
        <span class="label">ស្ថានភាពបច្ចុប្បន្ន <b>*</b></span>
        <div id="status" class="grid one" role="radiogroup"></div>
        <small class="err">សូមជ្រើសរើសស្ថានភាព</small>
      </section>

      <section class="field" data-field="detail">
        <label for="detail">ពិពណ៌នាបញ្ហា / កំណត់សម្គាល់ <em>(មិនបំពេញក៏បាន)</em></label>
        <textarea id="detail" rows="4" maxlength="700" placeholder="ឧ. បើកមិនឡើង, ដំណើរការយឺត, ព្រីនចេញជាឆ្នូត..."></textarea>
        <div class="count"><span id="count">0</span>/700</div>
      </section>

      <section class="field" data-field="priority">
        <span class="label">ភាពបន្ទាន់ <b>*</b></span>
        <div id="priority" class="grid three" role="radiogroup"></div>
        <small class="err">សូមជ្រើសរើសកម្រិតភាពបន្ទាន់</small>
      </section>

      <!-- ប៊ូតុងនេះបង្ហាញតែពេលបើកក្រៅ Telegram (សាកល្បង) -->
      <button type="submit" id="fallbackSubmit" class="primary" hidden>បញ្ជូនរបាយការណ៍</button>
    </form>

    <p class="note">បន្ទាប់ពីបញ្ជូន Bot នឹងសួរអ្នកអំពីរូបថត (បើមាន) ។</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
